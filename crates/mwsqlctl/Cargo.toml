[package]
name = "mwsqlctl"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
description = "middleWHERE admin CLI."
build = "build.rs"

[lib]
name = "mwsqlctl"
path = "src/lib.rs"

[[bin]]
name = "mwsqlctl"
path = "src/main.rs"

[dependencies]
mw-core.workspace = true
anyhow.workspace = true
clap.workspace = true
rpassword = "7"
tracing.workspace = true
tracing-subscriber.workspace = true
base64.workspace = true
sha2.workspace = true
# `env add --url`: correct percent-decoding of userinfo. Already in the lock as
# a transitive dep, so this adds no new supply chain.
url = "2"
percent-encoding = "2"

# Root detection (euid) + sudo re-exec for the service-mode wizard on every unix.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Crypto-random temp-file names for the Windows UAC relaunch (defeats a
# same-user pre-plant of the redirect target). Reuses the workspace pin.
[target.'cfg(windows)'.dependencies]
rand.workspace = true

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile = "3"

# Lets `cargo binstall --git <repo> mwsqlctl` pull the prebuilt binary out of the
# shared release archive (asset names match the release workflow).
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/middlewhere-v{ version }-{ target }{ archive-suffix }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"
