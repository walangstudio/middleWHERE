[package]
name = "mwsqld"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
description = "middleWHERE secure SQL gateway daemon."
build = "build.rs"

[lib]
name = "mwsqld"
path = "src/lib.rs"

[[bin]]
name = "mwsqld"
path = "src/main.rs"

[dependencies]
mw-core.workspace = true
mw-net.workspace  = true
anyhow.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
tracing-appender.workspace = true
rand.workspace = true

# Peer-credential authz on the control channel (SO_PEERCRED/getpeereid,
# getpwuid/getgrnam group resolution) + the Unix-domain control socket.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-service = "0.7"
# Named-pipe peer authz (ImpersonateNamedPipeClient + CheckTokenMembership) and
# the explicit-DACL pipe security descriptor for the control channel.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile = "3"
# `test-util` powers the reaper's paused-time tests (start_paused + advance).
# Declared here rather than relied on via workspace feature unification.
tokio = { workspace = true, features = ["test-util"] }
mysql_async.workspace = true
tokio-postgres.workspace = true
russh.workspace = true
base64.workspace = true
sha2.workspace = true

# Lets `cargo binstall --git <repo> mwsqld` pull the prebuilt binary out of the
# shared release archive (asset names match the release workflow).
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/middlewhere-v{ version }-{ target }{ archive-suffix }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"
