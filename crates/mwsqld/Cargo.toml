[package]
name = "mwsqld"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
description = "middleWHERE secure SQL gateway daemon."
build = "build.rs"

[lib]
name = "mwsqld"
path = "src/lib.rs"

[[bin]]
name = "mwsqld"
path = "src/main.rs"

[dependencies]
mw-core.workspace = true
mw-net.workspace  = true
anyhow.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
tracing-appender.workspace = true
rand.workspace = true

[target.'cfg(windows)'.dependencies]
windows-service = "0.7"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile = "3"
mysql_async.workspace = true
tokio-postgres.workspace = true
russh.workspace = true
base64.workspace = true
sha2.workspace = true

# Lets `cargo binstall --git <repo> mwsqld` pull the prebuilt binary out of the
# shared release archive (asset names match the release workflow).
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/middlewhere-v{ version }-{ target }{ archive-suffix }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"
