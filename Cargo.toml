[workspace]
resolver = "2"
members = [
    "crates/mw-core",
    "crates/mw-net",
    "crates/mwsqld",
    "crates/mwsqlctl",
    "crates/mwsql",
]

[workspace.package]
version = "0.2.2"
edition = "2021"
rust-version = "1.78"
license = "MIT"
authors = ["scr1p7k177y <scriptkitty@walang.studio>"]
description = "Security-first SQL middleware gateway between clients and PostgreSQL/MySQL."
repository = "https://github.com/walangstudio/middleWHERE"
homepage = "https://github.com/walangstudio/middleWHERE"
keywords = ["sql", "proxy", "gateway", "security", "database"]
categories = ["command-line-utilities", "database"]
publish = false

[workspace.dependencies]
mw-core = { path = "crates/mw-core" }
mw-net  = { path = "crates/mw-net" }

anyhow         = "1"
thiserror      = "1"
serde          = { version = "1", features = ["derive"] }
ciborium       = "0.2"
zeroize        = { version = "1", features = ["derive", "serde"] }
chacha20poly1305 = "0.10"
argon2         = "0.5"
sha1           = "0.10"
subtle         = "2"
rand           = "0.8"
rand_core      = "0.6"
hex            = "0.4"
keyring        = "3"
tokio          = { version = "1", features = ["full"] }
tracing        = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tracing-appender = "0.2"
time           = { version = "0.3", features = ["formatting", "serde-human-readable"] }
serde_json     = "1"
sha2           = "0.10"
clap           = { version = "4", features = ["derive"] }
tokio-postgres = "0.7"
mysql_async    = { version = "0.37", default-features = false, features = ["minimal"] }
mysql_common   = { version = "0.37", default-features = false }
deadpool       = { version = "0.12", features = ["managed", "rt_tokio_1"] }
sqlparser      = { version = "0.52", features = ["visitor"] }
async-trait    = "0.1"
russh          = "0.60"
base64         = "0.22"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
