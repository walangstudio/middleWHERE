name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  lint:
    name: fmt + clippy + audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Installed here rather than via rustsec/audit-check, which runs an
      # unlocked `cargo install` and so resolves cargo-audit's deps to whatever
      # is newest - kstring 2.0.4 now requires rustc 1.96 and fails to compile
      # against the toolchain this job pins. `--locked` builds cargo-audit from
      # its own lockfile, which stays within our pinned toolchain.
      #
      # RUSTSEC-2023-0071 (rsa "Marvin" timing sidechannel): no patched version
      # exists; pulled in transitively by russh for SSH bastion key auth. Not
      # actionable until russh/ssh-key migrate off the rsa crate.
      - name: cargo audit
        run: |
          cargo install cargo-audit --locked
          cargo audit --ignore RUSTSEC-2023-0071

  workflow-guards:
    name: workflow + build-script guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: workflow / build-script guards
        run: bash tests/workflow_test.sh

  test:
    name: build + test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - name: macos-x86_64
            os: macos-14
            target: x86_64-apple-darwin
          - name: macos-arm64
            os: macos-14
            target: aarch64-apple-darwin
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --release --locked --target ${{ matrix.target }}
      - name: Test
        run: cargo test --workspace --locked --target ${{ matrix.target }}
